# JWT Settings for tests
jwt.secret=nQ9XKp3Lv6yRf8jWtEwP2bGc7ZmY5xH1v4Sd0AaBbCcDdEeFfGgHhIiJjJkKlLmMnNoPqQrRsStTuU
jwt.access.expirationMs=3600000
jwt.refresh.expirationMs=86400000

# Internal secret for tests
gateway.internal.secret=test-internal-secret-123

# Disable liquibase in tests
spring.liquibase.enabled=false

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Database
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/insert_test_user.sql
spring.sql.init.schema-locations=classpath:schema.sql

# Datasource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Test containers will override these
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=testuser
spring.datasource.password=testpass

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379